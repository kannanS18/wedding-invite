<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2C201A" />
      <stop offset="60%" stop-color="#1A120E" />
      <stop offset="100%" stop-color="#0E0907" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E7824" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Circular Shield -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Inset Delicate Beaded Border -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3.5, 2.5" opacity="0.85" />
  
  <!-- Auspicious Star Accents -->
  <text x="64" y="24" font-family="serif" font-size="10" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">✦</text>

  <!-- Royal Monogram S ♥ S -->
  <g filter="url(#goldGlow)">
    <!-- First 'S' -->
    <text x="38" y="76" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="38" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">S</text>
    
    <!-- Heart in Center -->
    <text x="64" y="69" font-family="serif" font-size="17" fill="#E8B945" text-anchor="middle">♥</text>
    
    <!-- Second 'S' -->
    <text x="90" y="76" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="38" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">S</text>
  </g>

  <!-- Bottom Auspicious Subtitle / Year -->
  <text x="64" y="104" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="700" letter-spacing="2.5" fill="#E5C158" text-anchor="middle" opacity="0.95">2026</text>
</svg>
