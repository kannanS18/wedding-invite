<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sri Krishna & Swetha | The Wedding</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            --gold: #C5A869;
            --gold-dark: #A68B50;
            --gold-light: #FCE8A1;
            --charcoal: #0a0a0a;
            --ivory: #FDFBF7;
            --ivory-dark: #F0E8D9;
            --pink-glow: #FF69B4;
            --rich-magenta: #FF1493; /* New deeper, richer hue */
            
            --font-calligraphy: 'Playfair Display', serif;
            --font-heading: 'Cormorant Garamond', serif;
            --font-sans: 'Outfit', sans-serif;
        }

        html, body {
            margin: 0; padding: 0;
            background-color: var(--charcoal); 
            font-family: var(--font-sans);
            color: var(--charcoal);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            touch-action: none;
        }

        /* --- PERFORMANCE OPTIMIZATIONS --- */
        .viewport, .camera, .interactive-tilt, .card-3d, .door, .flap, .core-plate, .bulb {
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform: translateZ(0);
        }

        /* --- INTERACTIVE GLOW & GLITTER --- */
        #cursor-glow {
            position: fixed; top: 0; left: 0; width: 140px; height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 20, 147, 0.4) 0%, rgba(255, 20, 147, 0) 70%);
            pointer-events: none; z-index: 99;
            transform: translate(-50%, -50%); opacity: 0; transition: opacity 0.3s;
        }
        #glitter-canvas {
            position: fixed; inset: 0; pointer-events: none; z-index: 98;
        }

        /* --- BACKGROUND FLOATING PINK HEARTS & FOG --- */
        #bg-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .hollow-heart {
            position: absolute; width: 40px; height: 40px;
            opacity: 0;
            will-change: transform, opacity;
        }
        .pink-fog {
            position: fixed; bottom: 0; left: 0; width: 100vw; height: 30vh;
            background: linear-gradient(to top, rgba(255, 20, 147, 0.12) 0%, transparent 100%);
            pointer-events: none; z-index: 0;
        }

        /* --- THE 3D VIEWPORT --- */
        .viewport {
            width: 100vw; height: 100vh;
            perspective: 1500px; overflow: hidden; position: relative;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            z-index: 1;
        }

        /* --- REDUCED HYPER-REALISTIC HANGING LIGHTS --- */
        #hanging-clusters {
            position: absolute; top: -2vh; left: 0; width: 100vw; height: 30vh;
            z-index: 20; pointer-events: none;
        }
        .cluster { position: absolute; top: 0; }
        .left-cluster { left: 10vw; }
        .center-cluster { left: 50vw; transform: translateX(-50%); }
        .right-cluster { right: 10vw; }

        .bulb {
            position: absolute; top: 0;
            display: flex; flex-direction: column; align-items: center;
            transform-origin: top center;
        }
        /* Realistic Wire catching light */
        .bulb .wire {
            width: 1.5px;
            background: linear-gradient(to bottom, #111 0%, #333 70%, var(--rich-magenta) 100%);
        }
        /* Metallic Socket Cap */
        .bulb::before {
            content: ''; width: 6px; height: 6px; 
            background: #2a2a2a; border-radius: 2px;
            box-shadow: inset 0 -2px 2px #111;
            margin-bottom: -1px; z-index: 4;
        }
        
        /* The Glass Heart */
        .bulb svg {
            width: 35px; height: 35px;
            margin-top: -6px; /* Pull up into socket */
            position: relative; z-index: 3;
            overflow: visible;
        }
        
        /* The Hot LED Core Filament */
        .bulb-core {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 6px; border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px 4px var(--pink-glow), 0 0 18px 6px var(--rich-magenta);
            z-index: 2;
        }

        /* The Massive Rich Ambient Glow */
        .bulb::after {
            content: ''; position: absolute; bottom: 0px; left: 50%; transform: translateX(-50%);
            width: 80px; height: 80px;
            background: radial-gradient(circle, rgba(255,20,147,0.5) 0%, rgba(255,105,180,0.15) 35%, transparent 70%);
            z-index: 1;
        }

        /* Left Cluster (1 Bulb) */
        .b-l1 { left: 0; animation: swing 4.5s ease-in-out infinite alternate; }
        .b-l1 .wire { height: 18vh; }

        /* Center Cluster (3 Bulbs) */
        .b-c1 { left: -35px; animation: swing 4.2s ease-in-out infinite alternate; }
        .b-c1 .wire { height: 14vh; }
        
        .b-c2 { left: 0px; animation: swing 4.9s ease-in-out infinite alternate-reverse; }
        .b-c2 .wire { height: 23vh; }
        .b-c2 svg { width: 45px; height: 45px; } /* Center Hero Bulb */
        .b-c2 .bulb-core { bottom: 20px; width: 8px; height: 8px; box-shadow: 0 0 15px 5px var(--pink-glow), 0 0 25px 10px var(--rich-magenta); }
        .b-c2::after { width: 110px; height: 110px; bottom: -5px; }
        
        .b-c3 { left: 35px; animation: swing 4.6s ease-in-out infinite alternate; }
        .b-c3 .wire { height: 17vh; }

        /* Right Cluster (1 Bulb) */
        .b-r1 { right: 0; animation: swing 4.8s ease-in-out infinite alternate-reverse; }
        .b-r1 .wire { height: 16vh; }

        @keyframes swing {
            0% { transform: rotate(6deg); }
            100% { transform: rotate(-6deg); }
        }

        .camera, .interactive-tilt {
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            display: flex; justify-content: center; align-items: center;
        }

        /* --- THE PHYSICAL CARD --- */
        .card-3d {
            position: relative;
            width: 90vw; max-width: 450px;
            height: 75vh; max-height: 700px;
            transform-style: preserve-3d;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }

        /* Typography Helpers */
        .t-heading { font-family: var(--font-heading); }
        .t-sans { font-family: var(--font-sans); }
        .t-calligraphy { font-family: var(--font-calligraphy); font-style: italic; }
        .text-gold { color: var(--gold-dark); }

        .gold-shimmer {
            background: linear-gradient(-45deg, #9C7D40 0%, #FCE8A1 40%, #FFF6CC 50%, #FCE8A1 60%, #9C7D40 100%);
            background-size: 300% 300%; background-position: 0% 0%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .reveal-wrap { overflow: hidden; display: inline-block; vertical-align: top; padding: 2px 5px; }
        .reveal-text { transform: translateY(120%); opacity: 0; transform-style: preserve-3d; }

        /* --- LAYER 1: THE INNER CORE --- */
        .core-plate {
            position: absolute; inset: 0; 
            background: radial-gradient(circle at top center, #FFFFFF 0%, var(--ivory) 100%);
            border: 1px solid rgba(197, 168, 105, 0.6);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; z-index: 1; transform-style: preserve-3d;
        }
        
        .section { margin-bottom: 25px; transform-style: preserve-3d; }
        .inv-star { width: 30px; height: 30px; border: 1px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
        .inv-star svg { width: 14px; height: 14px; fill: none; stroke: var(--gold); stroke-width: 1.5; }
        .core-label { font-size: 0.8rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold-dark); margin-bottom: 5px; }
        .date-huge { font-size: clamp(4.5rem, 15vw, 7rem); line-height: 0.9; margin: -5px 0; }
        .date-month { font-size: 1.3rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--charcoal); }
        .venue-main { font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.1; margin-bottom: 5px; }
        .venue-sub { font-size: 1.1rem; color: #666; }
        .quote { font-size: 1.1rem; color: #444; line-height: 1.5; font-style: italic; padding: 0 10px; }

        /* --- LAYER 2: THE PHOTO FLAPS --- */
        .flap {
            position: absolute; width: 100%; height: 50%;
            overflow: hidden; transform-style: preserve-3d; backface-visibility: hidden;
            z-index: 5; background-color: var(--charcoal);
        }
        .flap-top { top: 0; transform-origin: top; }
        .flap-bottom { bottom: 0; transform-origin: bottom; }
        
        .flap-img {
            position: absolute; width: 100%; height: 200%;
            object-fit: cover; object-position: 25% center;
        }
        .flap-top .flap-img { top: 0; }
        .flap-bottom .flap-img { bottom: 0; }

        .flap-bottom::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
        }

        .hero-names {
            position: absolute; bottom: 20px; left: 0; width: 100%;
            text-align: center; color: var(--ivory); z-index: 2;
        }
        .gs-name {
            font-size: clamp(2rem, 7vw, 3.5rem); margin: 0; line-height: 1;
            text-transform: uppercase; text-shadow: 0 4px 20px rgba(0,0,0,0.9);
            opacity: 0; transform: translateY(20px); letter-spacing: 0px;
        }
        
        .heart-arrow {
            width: 50px; height: 50px; margin: -5px auto;
            display: block; opacity: 0; transform: scale(0.5); 
        }

        .internal-shadow {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 6; pointer-events: none;
        }

        /* Ambient Golden Dust */
        .particle-container {
            position: absolute; inset: 0; z-index: 2; 
            pointer-events: none; transform-style: preserve-3d; opacity: 0; 
        }
        .dust-particle {
            position: absolute; width: 3px; height: 3px; 
            background: var(--gold-light); border-radius: 50%;
            box-shadow: 0 0 10px 2px var(--gold);
        }

        /* --- LAYER 3: THE GOLD DOORS --- */
        .door {
            position: absolute; top: 0; width: 50%; height: 100%;
            transform-style: preserve-3d; z-index: 10;
        }
        .door-left { left: 0; transform-origin: left center; }
        .door-right { right: 0; transform-origin: right center; }
        
        .door-face { position: absolute; inset: 0; backface-visibility: hidden; }
        .door-front {
            background: linear-gradient(135deg, var(--ivory) 0%, var(--ivory-dark) 100%);
            border: 1px solid rgba(197, 168, 105, 0.5);
            overflow: hidden;
        }
        .door-left .door-front { border-right: none; } 
        .door-right .door-front { border-left: 1px solid rgba(0,0,0,0.1); }
        
        .door-back {
            background-color: var(--charcoal); transform: rotateY(180deg);
            border: 1px solid rgba(197, 168, 105, 0.2); 
            box-shadow: inset 0 0 50px rgba(0,0,0,1);
        }

        .door-letter {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: clamp(6rem, 20vw, 12rem); color: var(--charcoal);
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5), -1px -1px 0 rgba(0,0,0,0.1);
        }
        .letter-s { right: clamp(30px, 12vw, 80px); }
        .letter-a { left: clamp(30px, 12vw, 80px); color: var(--gold-dark); }

        .amp-split {
            position: absolute; top: 50%; font-size: clamp(4rem, 15vw, 9rem);
            color: var(--gold-dark); font-family: var(--font-calligraphy);
            line-height: 1; text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
        }
        .amp-left { right: 0; transform: translate(50%, -50%); }
        .amp-right { left: 0; transform: translate(-50%, -50%); }

        /* --- MOBILE ORIENTED SCROLL HINT --- */
        .mobile-scroll-hint {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; cursor: pointer;
        }
        .hint-text {
            color: var(--gold); font-size: 0.8rem; letter-spacing: 0.2em; margin-bottom: 5px;
            font-family: var(--font-sans); text-shadow: 0 0 15px rgba(197,168,105,0.8);
            animation: pulseHint 2s infinite; white-space: nowrap;
        }
        .hint-arrow {
            width: 15px; height: 15px;
            border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold);
            transform: rotate(45deg);
            animation: bounceArrow 2s infinite;
        }
        .bottom-progress-bar {
            position: fixed; bottom: 0; left: 0; height: 4px; width: 0%;
            background: var(--pink-glow); box-shadow: 0 0 20px var(--pink-glow);
            z-index: 100;
        }

        @keyframes pulseHint { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        @keyframes bounceArrow { 0%, 100% { transform: translateY(0) rotate(45deg); opacity: 0.4; } 50% { transform: translateY(10px) rotate(45deg); opacity: 1; } }

    </style>
</head>
<body>

    <div id="cursor-glow"></div>
    <canvas id="glitter-canvas"></canvas>
    <div id="bg-hearts"></div>
    <div class="pink-fog"></div>

    <div class="mobile-scroll-hint" id="hint">
        <div class="hint-text">SWIPE UP OR TAP TO OPEN</div>
        <div class="hint-arrow"></div>
    </div>
    <div class="bottom-progress-bar"></div>

    <div class="viewport">
        
        <!-- REDUCED REALISTIC SERIAL LIGHTS (1 Left, 3 Center, 1 Right) -->
        <div id="hanging-clusters">
            <!-- Left Corner (1) -->
            <div class="cluster left-cluster">
                <div class="bulb b-l1">
                    <div class="wire"></div>
                    <div class="bulb-core"></div>
                    <!-- Delicate Glass Heart -->
                    <svg viewBox="0 0 100 100"><path d="M50 80 C 10 50 20 10 50 30 C 80 10 90 50 50 80" fill="rgba(255,20,147,0.05)" stroke="#FFD1DC" stroke-width="3"/></svg>
                </div>
            </div>
            
            <!-- Center Collective (3) -->
            <div class="cluster center-cluster">
                <div class="bulb b-c1">
                    <div class="wire"></div>
                    <div class="bulb-core"></div>
                    <svg viewBox="0 0 100 100"><path d="M50 80 C 10 50 20 10 50 30 C 80 10 90 50 50 80" fill="rgba(255,20,147,0.05)" stroke="#FFD1DC" stroke-width="3"/></svg>
                </div>
                <div class="bulb b-c2">
                    <div class="wire"></div>
                    <div class="bulb-core"></div>
                    <svg viewBox="0 0 100 100"><path d="M50 80 C 10 50 20 10 50 30 C 80 10 90 50 50 80" fill="rgba(255,20,147,0.05)" stroke="#FFD1DC" stroke-width="3"/></svg>
                </div>
                <div class="bulb b-c3">
                    <div class="wire"></div>
                    <div class="bulb-core"></div>
                    <svg viewBox="0 0 100 100"><path d="M50 80 C 10 50 20 10 50 30 C 80 10 90 50 50 80" fill="rgba(255,20,147,0.05)" stroke="#FFD1DC" stroke-width="3"/></svg>
                </div>
            </div>

            <!-- Right Corner (1) -->
            <div class="cluster right-cluster">
                <div class="bulb b-r1">
                    <div class="wire"></div>
                    <div class="bulb-core"></div>
                    <svg viewBox="0 0 100 100"><path d="M50 80 C 10 50 20 10 50 30 C 80 10 90 50 50 80" fill="rgba(255,20,147,0.05)" stroke="#FFD1DC" stroke-width="3"/></svg>
                </div>
            </div>
        </div>

        <div class="camera">
            <div class="interactive-tilt">
                <div class="card-3d">
                    
                    <!-- LAYER 1: THE CORE -->
                    <div class="core-plate">
                        <div class="section sec-date">
                            <div class="reveal-wrap"><div class="reveal-text core-label t-sans">The Wedding Of</div></div><br>
                            <div class="reveal-wrap"><div class="reveal-text date-huge t-heading gold-shimmer" style="padding-bottom:10px;">25</div></div><br>
                            <div class="reveal-wrap"><div class="reveal-text date-month t-sans">October 2026</div></div>
                        </div>
                        <div class="section sec-venue">
                            <div class="reveal-wrap">
                                <div class="reveal-text inv-star"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
                            </div><br>
                            <div class="reveal-wrap"><div class="reveal-text core-label t-sans">The Venue</div></div><br>
                            <div class="reveal-wrap"><div class="reveal-text venue-main t-heading gold-shimmer">Manamadurai,<br>Konnakulam</div></div><br>
                            <div class="reveal-wrap"><div class="reveal-text venue-sub t-calligraphy">Near Shree Navaneedhar Krishna Kovil</div></div>
                        </div>
                        <div class="section sec-quote">
                            <div class="reveal-wrap"><div class="reveal-text quote t-sans">"We heartfully invite you and your entire family to share our joy."</div></div>
                        </div>
                    </div>

                    <div class="particle-container"></div>

                    <!-- LAYER 2: THE PHOTO FLAPS -->
                    <div class="flap flap-top">
                        <img class="flap-img" src="couple.svg" alt="Couple illustration">
                    </div>
                    
                    <div class="flap flap-bottom">
                        <img class="flap-img" src="couple.svg" alt="Couple illustration">
                        
                        <div class="hero-names t-heading">
                            <div class="gs-name gs-name-1">Sri Krishna</div>
                            <svg class="heart-arrow gs-heart" viewBox="0 0 100 100">
                                <path d="M50 80 C 10 50 20 10 50 30 C 80 10 90 50 50 80" fill="none" stroke="var(--gold)" stroke-width="4"/>
                                <line x1="10" y1="90" x2="90" y2="10" stroke="var(--gold)" stroke-width="3"/>
                                <polygon points="90,10 75,15 85,25" fill="var(--gold)"/>
                                <line x1="10" y1="90" x2="5" y2="75" stroke="var(--gold)" stroke-width="3"/>
                                <line x1="10" y1="90" x2="25" y2="95" stroke="var(--gold)" stroke-width="3"/>
                            </svg>
                            <div class="gs-name gs-name-2">Swetha</div>
                        </div>
                    </div>

                    <div class="internal-shadow"></div>

                    <!-- LAYER 3: THE GOLD DOORS -->
                    <div class="door door-left">
                        <div class="door-face door-back"></div>
                        <div class="door-face door-front">
                            <div class="door-letter letter-s t-heading">S</div>
                            <div class="amp-split amp-left">&</div>
                        </div>
                    </div>

                    <div class="door door-right">
                        <div class="door-face door-back"></div>
                        <div class="door-face door-front">
                            <div class="amp-split amp-right">&</div>
                            <div class="door-letter letter-a t-heading">A</div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        /* --- INTERACTIVE 3D PARALLAX --- */
        const xTo = gsap.quickTo(".interactive-tilt", "rotationY", {duration: 0.8, ease: "power3"});
        const yTo = gsap.quickTo(".interactive-tilt", "rotationX", {duration: 0.8, ease: "power3"});
        
        /* --- INTERACTIVE HEART GLITTER & GLOW --- */
        const canvas = document.getElementById("glitter-canvas");
        const ctx = canvas.getContext("2d");
        const glow = document.getElementById("cursor-glow");
        
        let width, height;
        function resizeCanvas() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener("resize", resizeCanvas); resizeCanvas();

        let glitters = [];
        function spawnGlitter(x, y) {
            for(let i=0; i<2; i++) {
                glitters.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6, 
                    vy: (Math.random() - 0.5) * 6,
                    life: 1, decay: Math.random() * 0.03 + 0.02,
                    color: Math.random() > 0.3 ? '#FF1493' : '#FCE8A1', 
                    size: Math.random() * 15 + 10 
                });
            }
        }

        let lastSpawn = 0;
        window.addEventListener("mousemove", e => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20; 
            const y = (e.clientY / window.innerHeight - 0.5) * -20;
            xTo(x); yTo(y);

            glow.style.opacity = 1;
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';

            let now = Date.now();
            if (now - lastSpawn > 40) {
                spawnGlitter(e.clientX, e.clientY);
                lastSpawn = now;
            }
            clearTimeout(glow.timeout);
            glow.timeout = setTimeout(() => { glow.style.opacity = 0; }, 300);
        });

        window.addEventListener("touchmove", e => {
            const clientX = e.touches[0].clientX;
            const clientY = e.touches[0].clientY;
            
            glow.style.opacity = 1;
            glow.style.left = clientX + 'px';
            glow.style.top = clientY + 'px';

            let now = Date.now();
            if (now - lastSpawn > 50) {
                spawnGlitter(clientX, clientY);
                lastSpawn = now;
            }
            clearTimeout(glow.timeout);
            glow.timeout = setTimeout(() => { glow.style.opacity = 0; }, 300);
        }, {passive: true});

        function renderGlitter() {
            ctx.clearRect(0, 0, width, height);
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            for(let i = glitters.length - 1; i >= 0; i--) {
                let g = glitters[i];
                g.x += g.vx; g.y += g.vy; g.vy += 0.1; g.life -= g.decay;
                if(g.life <= 0) { glitters.splice(i, 1); continue; }
                ctx.globalAlpha = g.life; ctx.fillStyle = g.color;
                ctx.font = g.size + "px Arial"; ctx.fillText("♥", g.x, g.y);
            }
            requestAnimationFrame(renderGlitter);
        }
        renderGlitter();

        /* --- FLOATING PINK HEARTS GENERATOR --- */
        const heartSVG = `<svg viewBox="0 0 100 100"><path d="M50 80 C 10 50 20 10 50 30 C 80 10 90 50 50 80" fill="none" stroke="var(--pink-glow)" stroke-width="4"/></svg>`;
        const bgContainer = document.getElementById('bg-hearts');
        for(let i=0; i<10; i++) { 
            let h = document.createElement('div'); h.className = 'hollow-heart'; h.innerHTML = heartSVG;
            bgContainer.appendChild(h);
            gsap.set(h, { x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight + 200, scale: Math.random() * 0.8 + 0.4, opacity: 0 });
            gsap.to(h, { y: "-=120vh", x: "+=" + (Math.random() * 200 - 100), rotation: Math.random() * 180 - 90, opacity: 0.9, duration: Math.random() * 12 + 8, repeat: -1, ease: "none", delay: Math.random() * 8 });
        }

        /* --- AMBIENT INNER DUST --- */
        const pContainer = document.querySelector('.particle-container');
        for(let i=0; i<30; i++) {
            let p = document.createElement('div'); p.className = 'dust-particle'; pContainer.appendChild(p);
            gsap.set(p, { x: Math.random() * 300 - 150, y: Math.random() * 500 - 250, z: Math.random() * 150, opacity: 0, scale: Math.random() * 0.6 + 0.2 });
            gsap.to(p, { y: "-=100", x: "+=" + (Math.random() * 60 - 30), opacity: Math.random() * 0.8, duration: Math.random() * 4 + 3, repeat: -1, yoyo: true, ease: "sine.inOut", delay: Math.random() * 3 });
        }

        /* --- CINEMATIC AUTO-PLAY TIMELINE --- */
        window.onload = () => {
            gsap.fromTo(".card-3d", { y: 15 }, { y: -15, duration: 4, repeat: -1, yoyo: true, ease: "sine.inOut" });

            const tl = gsap.timeline({ paused: true });

            // 0.0s: Gold Doors Open & Shadows Fade
            tl.to(".door-left", { rotationY: -150, duration: 2, ease: "power3.inOut" }, 0);
            tl.to(".door-right", { rotationY: 150, duration: 2, ease: "power3.inOut" }, 0);
            tl.to(".internal-shadow", { opacity: 0, duration: 1.5, ease: "power2.inOut" }, 0);
            
            // 0.5s: Photo Names & Heart Arrow pop in
            tl.to(".gs-name-1", { opacity: 1, y: 0, letterSpacing: "2px", ease: "expo.out", duration: 1.5 }, 0.5);
            tl.to(".gs-heart", { opacity: 1, scale: 1, ease: "back.out(1.5)", duration: 1.2 }, 0.7);
            tl.to(".gs-name-2", { opacity: 1, y: 0, letterSpacing: "2px", ease: "expo.out", duration: 1.5 }, 0.9);

            // 2.0s: Photo Flaps Unfold
            tl.to(".flap-top", { rotationX: 160, duration: 2, ease: "power3.inOut" }, 2.0);
            tl.to(".flap-bottom", { rotationX: -160, duration: 2, ease: "power3.inOut" }, 2.0);
            tl.to(".particle-container", { opacity: 1, duration: 1 }, 2.5);
            
            // 2.2s: Push card back to give text breathing room
            tl.to(".core-plate", { z: -60, duration: 2, ease: "power2.inOut" }, 2.2);

            // --- PHASED TEXT REVEALS --- //
            
            // 3.0s Phase 1: Date
            tl.to(".sec-date .reveal-text", { y: 0, opacity: 1, z: 20, duration: 1.5, stagger: 0.15, ease: "expo.out" }, 3.0);
            
            // 4.0s Phase 2: Venue
            tl.to(".sec-venue .reveal-text", { y: 0, opacity: 1, z: 20, duration: 1.5, stagger: 0.15, ease: "expo.out" }, 4.0);
            
            // 5.0s Phase 3: Quote
            tl.to(".sec-quote .reveal-text", { y: 0, opacity: 1, z: 20, duration: 1.5, ease: "expo.out" }, 5.0);

            // 3.5s - 7.0s: Final Cinematic Camera Push & Gold Shimmer
            tl.to(".gold-shimmer", { backgroundPosition: "100% 100%", duration: 3, ease: "sine.inOut" }, 3.5);
            tl.to(".camera", { z: 350, rotationX: 3, duration: 5, ease: "power2.inOut" }, 3.5);

            // --- TRIGGER LOGIC (Swipe or Tap) --- //
            let animationStarted = false;
            function triggerInvite() {
                if (animationStarted) return;
                animationStarted = true;
                
                // Hide Hint & Start Progress Bar
                gsap.to("#hint", { opacity: 0, y: -20, duration: 0.5 });
                gsap.to(".bottom-progress-bar", { width: "100%", duration: 8.5, ease: "linear" });
                
                tl.play();
            }

            // Detect Desktop Wheel
            window.addEventListener("wheel", (e) => { if (e.deltaY > 0) triggerInvite(); });

            // Detect Mobile Swipe Up
            let startY = 0;
            window.addEventListener("touchstart", e => { startY = e.touches[0].clientY; }, {passive: true});
            window.addEventListener("touchend", e => {
                let endY = e.changedTouches[0].clientY;
                if (startY - endY > 40) triggerInvite(); // Swipe up threshold
            });

            // Detect Click / Tap
            document.getElementById("hint").addEventListener("click", triggerInvite);
            document.querySelector(".viewport").addEventListener("click", triggerInvite);
        };
    </script>
</body>
</html>
