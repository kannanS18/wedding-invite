<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <title>Wedding Invite</title>
    <meta name="title" content="Wedding Invite" />
    <meta name="description" content="Sri Krishna &amp; Swetha • Sunday, 25 October 2026 • Meeting Hall Konnakulam, Manamadurai." />
    
    <!-- Favicon and Apple Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Open Graph / WhatsApp / Facebook Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sri Krishna &amp; Swetha Wedding" />
    <meta property="og:title" content="Wedding Invite • Sri Krishna &amp; Swetha" />
    <meta property="og:description" content="Together with their families, cordially invite you to celebrate their wedding on Sunday, 25 October 2026 at Meeting Hall Konnakulam, Manamadurai." />
    <meta property="og:url" content="https://kannans18.github.io/wedding-invite/" />
    <meta property="og:image" content="https://kannans18.github.io/wedding-invite/images/wedding_share_preview.jpg" />
    <meta property="og:image:secure_url" content="https://kannans18.github.io/wedding-invite/images/wedding_share_preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wedding Invite - Sri Krishna &amp; Swetha" />

    <!-- Twitter / X Card Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wedding Invite • Sri Krishna &amp; Swetha" />
    <meta name="twitter:description" content="Together with their families, cordially invite you to celebrate their wedding on Sunday, 25 October 2026." />
    <meta name="twitter:image" content="https://kannans18.github.io/wedding-invite/images/wedding_share_preview.jpg" />
    
    <!-- Google Fonts Preconnect & Stylesheets for high-fidelity script typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    
    <!-- Self-hosted font preloads -->
    <link rel="preload" href="/fonts/GreatVibes-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/PlayfairDisplay-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/PlayfairDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- Dedicated Background Wedding Music Audio Element (Preloaded & Plays on Receive Invitation) -->
    <audio id="wedding-music-element" src="/audio/wedding_music.mp3" preload="auto" loop playsinline></audio>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
